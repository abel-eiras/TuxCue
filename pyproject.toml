[project]
name = "tuxcue"
version = "1.0.1"
description = "Cartwall / Soundboard para espectáculos teatrales"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "miniaudio>=1.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
    "pytest-qt>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "PySide6-stubs",
]

[project.scripts]
tuxcue = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = [
    "N802",   # Qt method overrides must keep camelCase (rowCount, setData, editorEvent, …)
    "B008",   # QModelIndex() as default arg is the standard Qt pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "F821",   # guarded imports (try/except ImportError) look undefined to ruff statically
]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
